services:
  - type: web
    name: automaintainer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn automaintainer.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: QUEUE_BACKEND
        value: redis
      - key: REDIS_URL
        fromService:
          type: redis
          name: automaintainer-redis
          property: connectionString

