services:
  - type: web
    name: automaintainer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn automaintainer.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: development

